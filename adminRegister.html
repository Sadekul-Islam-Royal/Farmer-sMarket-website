<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration</title>
    <style>
        body { font-family: Arial, sans-serif; background: #2e7d32 url('crop01.jpeg') no-repeat center center/cover; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 400px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); padding: 30px; border-radius: 15px; color: #fff; border: 2px solid rgba(255,255,255,0.3); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #4caf50; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .back-btn { background: #757575; text-decoration: none; display: block; text-align: center; padding: 12px; border-radius: 6px; color: white; margin-top: 10px; font-weight: bold;}
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Step 1: Info Form -->
        <form id="adminForm" onsubmit="goToStep2(event)">
            <h2>Admin Registration</h2>
            <div class="form-group"><label>Name:</label><input type="text" id="adminName" required></div>
            <div class="form-group"><label>Phone Number:</label><input type="tel" id="adminPhone" required></div>
            <div class="form-group"><label>Email ID:</label><input type="email" id="adminIdEmail" required></div>
            <div class="form-group"><label>Employee ID:</label><input type="text" id="adminIdEmployee" required></div>
            <button type="submit">Next</button>
            <a href="registerRoleSelect.html" class="back-btn">Back</a>
        </form>

        <!-- Step 2: Password & Backend Submission -->
        <form id="step2" class="hidden" action="admin_process.php" method="POST" onsubmit="return validatePassword(event)">
            <h2>Set Password</h2>
            <input type="hidden" name="adminName" id="h_name">
            <input type="hidden" name="adminPhone" id="h_phone">
            <input type="hidden" name="adminIdEmployee" id="h_emp">

            <div class="form-group">
                <label>Username (Email ID):</label>
                <input type="text" id="regUser" name="adminIdEmail" readonly style="background: #eee; color: #333;">
            </div>
            <div class="form-group"><label>Password:</label><input type="password" id="password" name="password" required></div>
            <div class="form-group">
                <label>Confirm Password:</label><input type="password" id="confirmPassword" required>
                <small id="errorMsg" style="color: #ff6b6b; display: none; font-weight: bold; margin-top: 5px;">Passwords do not match!</small>
            </div>
            <button type="submit">Submit</button>
            <button type="button" class="back-btn" onclick="goToStep1()" style="border:none; cursor:pointer; width:100%;">Back</button>
        </form>
    </div>

    <script>
        function goToStep2(event) {
            event.preventDefault();
            document.getElementById('h_name').value = document.getElementById('adminName').value;
            document.getElementById('h_phone').value = document.getElementById('adminPhone').value;
            document.getElementById('h_emp').value = document.getElementById('adminIdEmployee').value;
            document.getElementById('regUser').value = document.getElementById('adminIdEmail').value;

            document.getElementById('adminForm').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function goToStep1() {
        // Step 2 এর পাসওয়ার্ড ও কনফার্ম পাসওয়ার্ড ফিল্ড এবং এরর মেসেজ সম্পূর্ণ রিসেট/খালি করা
        document.getElementById('password').value = ''; 
        document.getElementById('confirmPassword').value = ''; 
        document.getElementById('errorMsg').style.display = 'none';

        // Step 2 লুকিয়ে Step 1 দেখানো (Step 1 এর ডেটা অপরিবর্তিত থাকবে)
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('adminForm').classList.remove('hidden');
    }

    function goToIndex() {
        
        document.getElementById('adminForm').reset();
        window.location.href = 'registerRoleSelect.html';
    }
        function validatePassword(event) {
            let pass = document.getElementById('password').value;
            let confirmPass = document.getElementById('confirmPassword').value;
            let errorMsg = document.getElementById('errorMsg');

            if (pass !== confirmPass) {
                errorMsg.style.display = 'block';
                event.preventDefault();
                return false;
            }
            errorMsg.style.display = 'none';
            return true;
        }
    </script>
</body>
</html>
