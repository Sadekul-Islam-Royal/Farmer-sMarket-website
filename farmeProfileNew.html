<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer's Market</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('crop01.jpeg') no-repeat;
            background-size: cover;
            background-position: center;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
            width: 100%;
            position: sticky;
            top: 0;
            background: transparent;
            box-shadow: 0 10px 20px rgba(0, 0, 0, .5);
            backdrop-filter: blur(10px);
            z-index: 999;
        }

        .navbar-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0 2rem;
            max-width: 1600px;
        }

        .navbar-logo {
            font-size: 2rem;
            font-weight: 600;
            color: #000;
            text-decoration: none;
            cursor: pointer;
        }

        .navbar-container .navbar-menu {
            display: flex;
            text-align: center;
            gap: 1.5rem;
            list-style: none;
        }

        .navbar-container .navbar-menu li a {
            text-decoration: none;
            color: #000;
            font-size: 1.3rem;
            font-weight: 500;
            padding: 3px 30px;
            border-radius: 20px;
            border: 2px solid transparent;
            transition: all 0.7s ease;
            white-space: nowrap;
        }

        .navbar-container .navbar-menu li a:hover {
            color: #162530;
            background: rgba(188, 212, 229, 0.8);
            border: 2px solid #000;
        }

        .navbar-toggle {
            display: none;
            background: transparent;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        .bar {
            display: block;
            width: 25px;
            height: 3px;
            margin: 5px auto;
            background: #000;
            transition: all 0.3s ease-in-out;
        }

        .wrapper {
            position: relative;
            width: 420px;
            background: transparent;
            border: 3px solid rgba(0, 0, 0, .4);
            backdrop-filter: blur(11.4px);
            box-shadow: 0 0 10px rgba(0, 0, 0, .4);
            color: #000;
            border-radius: 15px;
            padding: 30px 40px;
            overflow: hidden;
        }

        .wrapper .close {
            position: absolute;
            top: 0;
            right: 0;
            width: 35px;
            height: 35px;
            background: #162938;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom-left-radius: 15px;
            cursor: pointer;
        }

        .wrapper .close img {
            width: 16px;
            height: 16px;
            filter: brightness(0) invert(1);
        }

        .wrapper .form-box {
            width: 100%;
            padding: 8px 0;
        }

        .form-box h1 {
            font-size: 36px;
            color: #000;
            text-align: center;
            margin-bottom: 15px;
        }

        /* Role Selection Checkboxes */
        .role-selection {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.5);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.3);
        }

        .role-option {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #000;
            cursor: pointer;
            font-weight: 500;
        }

        .role-option input {
            accent-color: #0000FF; /* নীল রঙের রেডিও বাটন */
            margin-right: 5px;
            cursor: pointer;
        }

        .input-box {
            position: relative;
            width: 100%;
            height: 50px;
            margin: 20px 0;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: 3px solid #000; /* কালো রঙের ইনপুট বর্ডার */
            border-radius: 15px;
            outline: none;
            font-size: 16px;
            color: #000;
            padding: 0 45px 0 20px;
        }

        .input-box input::placeholder {
            color: #fff;
            opacity: 0.9;
        }

        .input-box img {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            filter: brightness(0) invert(1);
        }

        .remember-forget {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .remember-forget label {
            color: #FF0000;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .remember-forget label input {
            accent-color: #0000FF;
            margin-right: 6px;
            transform: scale(1.1);
            cursor: pointer;
        }

        .remember-forget a {
            color: #0000FF; 
            text-decoration: none;
        }

        .remember-forget a:hover {
            text-decoration: underline;
        }

        .btn {
            margin-top: 15px;
            width: 100%;
            height: 45px;
            background: #fff;
            border: 2px solid #000;
            outline: none;
            border-radius: 40px;
            cursor: pointer;
            font-size: 18px;
            color: #000;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: hsl(110, 86%, 57%);
            color: #fff;
        }

        .register-link {
            font-size: 15px;
            text-align: center;
            margin-top: 20px;
        }

        .register-link p a {
            color: #0000FF; 
            text-decoration: none;
            font-weight: 600;
        }

        .register-link p a:hover {
            text-decoration: underline;
        }

         @media (max-width: 880px) {
            .navbar {
                backdrop-filter: none;
            }

            .navbar-container .navbar-menu {
                display: none;
                flex-direction: column;
                align-items: flex-start;
                gap: 1.7px !important;
                position: absolute;
                height: 100vh;
                width: 250px;
                top: 0;
                right: 0;
                padding: 5rem 1.5rem;
                box-shadow: 0 10px 10px rgba(0, 0, 0, .5);
                backdrop-filter: blur(10px);
            }

            .navbar-container .navbar-menu.active {
                display: flex;
            }

            .navbar-toggle {
                display: block;
                z-index: 999;
            }

            .navbar-toggle.active .bar:nth-child(2) {
                opacity: 0;
            }

            .navbar-toggle.active .bar:nth-child(1) {
                transform: translateY(8px) rotate(45deg);
            }

            .navbar-toggle.active .bar:nth-child(3) {
                transform: translateY(-8px) rotate(-45deg);
            }

        }

        @media (max-width: 480px) {
            .navbar-container {
                padding: 0 1rem;
            }

            .navbar-logo {
                font-size: 1.7rem;
            }

            .navbar-container .navbar-menu li a {
                font-size: 1.2rem;
                padding: 3px 15px;
            }
        }

    </style>
</head>

<body>

    <header>
        <nav class="navbar">
            <div class="navbar-container">
                <a href="index.html" class="navbar-logo">Farmer's Market</a>
                <button class="navbar-toggle">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
                <ul class="navbar-menu">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Login</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="wrapper" id="loginWrapper">
        <span class="close" onclick="closeLoginForm()">
            <img src="close.ico" alt="close Icon">
        </span>
        <div class="form-box">
            <h1>Login</h1>

            <form action="login.php" method="POST" id="loginForm">

                <!-- Role Selection -->
                <div class="role-selection">
                    <label class="role-option">
                        <input type="radio" name="user_role" value="farmer" checked onclick="updateInputType('farmer')"> Farmer
                    </label>
                    <label class="role-option">
                        <input type="radio" name="user_role" value="mill_owner" onclick="updateInputType('mill_owner')"> Mill Owner
                    </label>
                    <label class="role-option">
                        <input type="radio" name="user_role" value="admin" onclick="updateInputType('admin')"> Admin
                    </label>
                </div>

                <!-- Username Input Box -->
                <div class="input-box">
                    <input type="tel" id="username" name="username" placeholder="Phone Number" required autocomplete="off">
                    <img src="user.ico" alt="User Icon">
                </div>

                <!-- Password Input Box -->
                <div class="input-box">
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <img src="padlock.ico" alt="Lock Icon">
                </div>

                <div class="remember-forget">
                    <label id="remember-label">
                        <input type="checkbox" id="remember-checkbox" onchange="changeLabelColor()"> Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="btn">Login</button>

                <div class="register-link">
                    <p>Don't have an account? <a href="registerRoleSelect.php">Register</a></p>
                </div>

            </form>
        </div>
    </div>

    <script>
        const navbarToggle = document.querySelector('.navbar-toggle');
        const navbarmenu = document.querySelector('.navbar-menu');

        navbarToggle.addEventListener('click', () => {
            navbarToggle.classList.toggle('active');
            navbarmenu.classList.toggle('active');
        });

        function changeLabelColor() {
            const checkbox = document.getElementById('remember-checkbox');
            const label = document.getElementById('remember-label');

            if (checkbox.checked) {
                label.style.color = '#000'; 
            } else {
                label.style.color = '#FF0000'; 
            }
        }

        const loginWrapper = document.getElementById('loginWrapper');
        const loginForm = document.getElementById('loginForm');
        const loginNavBtn = document.querySelector('.navbar-menu li:last-child a');

        loginNavBtn.addEventListener('click', (e) => {
            e.preventDefault();
            loginWrapper.style.display = 'block';
        });

        function closeLoginForm() {
            loginWrapper.style.display = 'none';
            loginForm.reset();
            updateInputType('farmer');
            document.getElementById('remember-label').style.color = '#000';
        }

        document.querySelector('.register-link a').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = this.getAttribute('href');
        });

        if (new URLSearchParams(window.location.search).get('login') === 'true') {
            loginWrapper.style.display = 'block';
        }

        function updateInputType(role) {
            const usernameInput = document.getElementById('username');

            if (role === 'farmer') {
                usernameInput.type = 'tel';
                usernameInput.placeholder = 'Phone Number';
            } else if (role === 'mill_owner') {
                usernameInput.type = 'text';
                usernameInput.placeholder = 'Mill ID / Registration Number';
            } else if (role === 'admin') {
                usernameInput.type = 'email';
                usernameInput.placeholder = 'Email Address';
            }
        }
    </script>

</body>

</html>
